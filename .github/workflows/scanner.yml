name: Pague Menos Radar Monitor & Auto-Deploy

on:
  schedule:
    # Executa a cada 30 minutos automaticamente
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'promos.json'
      - 'promos.db'
      - 'README.md'

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Varredura Geral de Ofertas e Bugs
        run: python scanner.py

      - name: Commit e Push dos Dados Atualizados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/promos.json promos.json promos.db
          git diff --staged --quiet || git commit -m "Auto-update: Catálogo e PromoBugs atualizados [skip ci]"
          git push
