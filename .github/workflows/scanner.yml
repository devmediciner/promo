name: PromoRadar Monitor & Auto-Deploy

on:
  workflow_dispatch: # Apenas disparo manual se o usuário quiser no futuro, NUNCA automático


permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Varredura Multi-Lojas e Notificações Inteligentes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py

      - name: Commit e Push dos Dados e Deduplicação
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/promos.json promos.json promos.db data/notified_products.json config.json
          git diff --staged --quiet || git commit -m "Auto-update: Varredura 10m e deduplicação de alertas [skip ci]"
          git pull --rebase origin main || true
          git push origin main
